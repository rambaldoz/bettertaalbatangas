# Fencing Permit
# Page: /services/building/fencing-permit
# Source: Taal Citizen's Charter 2026 (1st Edition), p. 167
#
# Keep wording, fees and times as printed in the Charter. Fix only obvious
# typos, and explain any correction in "notes". See content/services/README.md.

title: Fencing Permit
summary: Accessory permit for fences, sidewalks and scaffolding
description: Fencing and demolition permits are accessory permits issued by the Building Official
  for work done before or during the processing of the building permit. The fencing permit covers
  fences not higher than 1.80 meters, sidewalk construction, foundation encroachment on public
  areas, temporary sidewalk enclosures, signs, and scaffolding. Get it before building the fence.
icon: Fence
office: meo
source:
  page: 167
classification: Simple
transactionType: G2B, G2C (Government to Business, Government to Citizen)
whoMayAvail: All residents of Taal
requirements:
- group: If you are the registered owner of the lot (1 copy each)
  items:
  - item: Certified true copy of the OCT/TCT on file with the Registry of Deeds
    where: Registry of Deeds
  - item: Tax Declaration
    where: Taal Assessor's Office
  - item: Current real property tax receipt
- group: If you are not the registered owner, in addition to the above
  items:
  - item: Notarized Contract of Lease or Sale
    where: Client
  - item: Notarized Deed of Absolute Sale
    where: Client
- group: For everyone
  items:
  - item: Barangay clearance
    where: Designated barangay hall
  - item: Five (5) sets of survey plans, design plans, specifications and forms, signed and
      sealed by the architect, civil engineer, electrical, mechanical, sanitary and electronics
      engineers, master plumber, environmental planner, interior designer and geodetic engineer,
      as applicable
    where: Client
steps:
- client: Request the permit forms and checklist of requirements for fencing.
  agency:
  - Gives the checklist and forms
  - Briefs you on the process
  fee: None
  time: 15 minutes
  responsible: Municipal Engineer and Engineering Staff
- client: Submit the requirements for initial checking. If anything is lacking, submit the missing
    documents or corrected plans.
  agency:
  - Checks if the requirements are complete
  - Tells you if they are complete or need corrections
  fee: None
  time: 20 minutes
  responsible: Municipal Engineer and Engineering Staff
- client: Get the order of payment once the application is complete.
  agency:
  - Issues the order of payment
  fee: None
  time: 30 minutes
  responsible: Municipal Engineer and Engineering Staff
- client: Pay the fees at the Treasurer's Office and get the official receipt.
  agency:
  - Receives payment and issues the official receipt
  fee: Based on the National Building Code fee schedule and the Local Revenue Code
  time: 5 minutes
  responsible: Revenue Collection Clerk
- client: Return to the Engineering Office and submit the official receipt.
  agency:
  - Receives the receipt and tells you the release date
  - Processes the permit
  fee: None
  time: 5 minutes
  responsible: Municipal Engineer and Engineering Staff
- client: On the scheduled date, receive the permit at the Engineering Office and sign the logbook.
  agency:
  - Releases the approved Fencing Permit
  fee: None
  time: 5 minutes
  responsible: Municipal Engineer and Engineering Staff
totalFee: Based on the National Building Code fee schedule and the Local Revenue Code
totalTime: 1 hour and 45 minutes
notes:
- The Charter lists 1 hour and 45 minutes as the total, while its steps add up to 1 hour and
  20 minutes.
