# Certificate of Indigency
# Page: /services/social-welfare/certificate-of-indigency
# Source: Taal Citizen's Charter 2026 (1st Edition), p. 88
#
# Keep wording, fees and times as printed in the Charter. Fix only obvious
# typos, and explain any correction in "notes". See content/services/README.md.

title: Certificate of Indigency
fullTitle: Provision of Certificate of Indigency
summary: Needed to avail of help from charities, government offices and NGOs
description: A certificate of indigency is required to avail of services from charitable institutions,
  government offices and non-government organizations.
icon: FileUser
office: mswdo
source:
  page: 88
classification: Simple
transactionType: Government-to-Citizen (G2C)
whoMayAvail: Clients from all sectors
requirements:
- group: 1 copy of the following
  items:
  - item: Barangay Certification of Indigency
    where: Barangay
  - item: Certification from the Municipal Assessor that you do not own real property (for court
      purposes)
    where: Municipal Assessor's Office
steps:
- client: Write your name and purpose in the client logbook.
  agency:
  - Briefs you on the service and its requirements
  fee: None
  time: 3 minutes
  responsible: DSWD Staff
- client: Answer the interview and give all the needed information.
  agency:
  - Conducts the interview
  fee: None
  time: 5 minutes
  responsible: DSWD Staff
- client: Wait while the staff prepares the Certificate of Indigency.
  agency:
  - Prepares the Certificate of Indigency
  fee: None
  time: 3 minutes
  responsible: DSWD Staff / Social Welfare Officer II / MSWD Officer
- client: Get the Certificate of Indigency and sign the logbook.
  agency:
  - Issues the Certificate of Indigency
  fee: None
  time: 2 minutes
  responsible: DSWD Staff / Social Welfare Officer II / MSWD Officer
totalFee: None
totalTime: 13 minutes
