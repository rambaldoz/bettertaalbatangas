  - spes
  - gip
  - tupad
  - career-coaching
  - ojt-immersion
  - work-endorsement
  - mayors-clearance-pnp
- category: Agriculture & Fisheries
  slug: agriculture
  icon: Wheat
  description: Farmer and fisherfolk registration, boat permits, insurance, seeds, soil analysis and anti-rabies vaccination
  services:
  - farmer-fisherfolk-registration
  - boat-permit
  - crop-livestock-boat-insurance
  - insurance-claim-assistance
  - agriculture-certificates
  - anti-rabies-vaccination
  - hvcc-seeds
