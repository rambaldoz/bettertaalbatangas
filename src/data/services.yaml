# Service categories for the Services directory (/services).
# Each category lists its services in display order; every slug needs a file
# at content/services/<category>/<service>.yaml. A category with no services
# shows as "Coming soon". popular: services shown on the home page.
# icon: any icon name from https://lucide.dev/icons

description: Browse all services offered by the Municipality of Taal
categories:
- category: Business & Permits
  slug: business
  icon: Store
  description: Business permits, tricycle permits and licensing
  services:
  - business-permit
  - tricycle-permit
- category: Civil Registry
  slug: civil-registry
  icon: FileText
  description: Birth, marriage and death registration, corrections and PSA copies
  services:
  - certified-true-copy
  - birth-registration
  - marriage-registration
  - death-registration
  - marriage-license
  - correction-of-clerical-error
  - change-of-first-name-sex-dob
  - legitimation-and-ausf
  - psa-documents-breqs
- category: Property & Real Property Tax
  slug: property
  icon: Map
  description: Real property tax, tax declarations, certifications and reassessment
  services:
  - real-property-tax
  - new-tax-declaration
  - certified-tax-declaration
  - property-certifications-and-maps
  - property-reassessment
- category: Taxes & Payments
  slug: taxes
  icon: Wallet
  description: Cedula, business tax and other fees paid at the Treasurer's Office
  services:
  - business-tax
  - community-tax-certificate
  - other-fees-and-charges
- category: Building & Construction
  slug: building
  icon: HardHat
