  - construction-permit-guide
  - building-permit
  - heritage-building-permit
  - fencing-permit
  - demolition-permit
  - sign-permit
  - occupancy-permit
  - electrical-permit
- category: Health
  slug: health
  icon: Stethoscope
  description: Consultations, certificates, laboratory tests, vaccines and burial permits
  services:
  - medical-consultation
  - dental-services
  - medical-certificate
  - health-certificate
  - family-planning
  - laboratory-tests
  - maternal-care
  - immunization
  - animal-bite-treatment
  - tb-dots
  - pre-marriage-counseling
  - social-hygiene-registration
  - gram-staining
  - blood-request
  - disease-reporting
  - philhealth-konsulta
  - maintenance-medicines
  - permit-to-bury
  - permit-to-transfer-remains
  - permit-to-open-grave
- category: Social Welfare
  slug: social-welfare
  icon: HandHeart
  description: Crisis assistance, case studies, and Senior Citizen, PWD and Solo Parent IDs
